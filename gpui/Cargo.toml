[package]
name = "tabletop-gpui"
version = "0.1.0"
edition = "2024"
description = "Tabletop with a GPUI front end: the studio behind a C bridge, its table drawn by GPUI"
publish = false

[[bin]]
name = "Tabletop"
path = "src/main.rs"

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
image = "0.25"
smallvec = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cmake = "0.1"
